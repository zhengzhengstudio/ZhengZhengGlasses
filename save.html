<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="铮铮眼镜图片保存页。">
    <title>铮铮眼镜 - 保存图片</title>
    <link rel="icon" href="assets/favicon.png?v=20260621-app3" type="image/png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=20260621-app3">
    <link rel="manifest" href="site.webmanifest?v=20260621-app3">
    <link rel="stylesheet" href="style.css?v=20260621-actionfix1">
</head>
<body class="save-page">
    <main class="save-page-shell">
        <section class="save-page-card">
            <div class="save-page-head">
                <div>
                    <p class="eyebrow">保存到设备</p>
                    <h1 id="save-page-title">铮铮眼镜图片</h1>
                    <p id="save-page-hint">如果直接下载失败，可以长按图片保存。</p>
                </div>
                <a class="btn btn-secondary" href="./index.html">回到首页</a>
            </div>
            <div class="save-page-stage" id="save-page-stage">
                <p class="save-page-empty">正在读取图片...</p>
            </div>
            <div class="save-page-actions">
                <a class="btn btn-primary" id="save-page-download" href="#" download="glasses-image.png">下载图片</a>
                <button class="btn btn-secondary" id="save-page-share" type="button">系统分享</button>
                <button class="btn btn-secondary" id="save-page-wechat" type="button">微信内分享</button>
                <button class="btn btn-secondary" id="save-page-open" type="button">只打开图片</button>
                <button class="btn btn-secondary" type="button" onclick="history.length > 1 ? history.back() : location.href = './index.html'">返回上一页</button>
            </div>
        </section>
    </main>
    <script src="save.js?v=20260621-actionfix1"></script>
</body>
</html>
