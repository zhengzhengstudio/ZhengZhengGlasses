<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="铮铮眼镜商家沟通台，用于查看顾客参数、订单与定制沟通记录。">
    <title>商家沟通 - 铮铮眼镜</title>
    <link rel="icon" href="assets/favicon.png?v=20260621-app3" type="image/png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=20260621-app3">
    <link rel="manifest" href="site.webmanifest?v=20260621-app3">
    <link rel="stylesheet" href="style.css?v=20260621-actionfix1">
</head>
<body class="merchant-page chat-page">
    <div class="glasses-container home-container">
        <header class="site-header home-header">
            <div class="header-top">
                <a href="./merchant.html" class="logo" aria-label="返回商家后台">
                    <span class="logo-mark">
                        <img src="assets/glasses-frame-black-rectangle-v1.png" alt="">
                    </span>
                    <span>商家沟通</span>
                </a>
                <nav class="top-nav" aria-label="商家沟通导航">
                    <a href="./merchant.html">商家后台</a>
                    <a href="./merchant.html#orders">订单</a>
                    <a href="./index.html">用户页</a>
                </nav>
                <div class="user-section" id="merchant-chat-user">
                    <span>商家用户</span>
                </div>
            </div>
        </header>

        <main>
            <section class="merchant-chat-shell">
                <aside class="merchant-chat-sidebar">
                    <div class="card-heading">
                        <div>
                            <p class="eyebrow">客户咨询</p>
                            <h1>按订单处理沟通。</h1>
                        </div>
                        <span id="merchant-chat-sync" class="chat-sync-pill">本地缓存</span>
                    </div>
                    <div class="merchant-chat-orders" id="merchant-chat-orders">
                        <p class="text-dim">正在读取订单...</p>
                    </div>
                </aside>

                <section class="chat-panel merchant-chat-panel" aria-label="商家聊天窗口">
                    <div class="merchant-order-summary" id="merchant-order-summary">
                        <p class="text-dim">选择一个订单后，会显示顾客参数和镜框信息。</p>
                    </div>
                    <div class="chat-thread" id="merchant-chat-thread"></div>
                    <div class="chat-quick-replies merchant-quick-replies" aria-label="商家快捷回复">
                        <button type="button" onclick="sendMerchantQuick('我先帮你核对镜圈宽度、鼻梁宽和移心量，再判断是否需要换框或调鼻托。')">核对尺寸</button>
                        <button type="button" onclick="sendMerchantQuick('这类情况建议补充医院或门店验光单：球镜、散光、轴位、瞳距和瞳高。网站采集数据只用于镜框适配参考。')">验光单</button>
                        <button type="button" onclick="sendMerchantQuick('如果要做定制，我需要确认材料、鼻托高度、镜腿长度、是否夹头/下滑，以及你希望的风格。')">定制</button>
                        <button type="button" onclick="sendMerchantQuick('请再发一张正脸清晰试戴图，我会按眼位和镜框边缘判断是否偏高、偏低或歪斜。')">要试戴图</button>
                    </div>
                    <form class="chat-input-row" onsubmit="sendMerchantMessage(event)">
                        <button class="btn btn-secondary chat-image-button" type="button" onclick="openMerchantImagePicker()">图片</button>
                        <input id="merchant-chat-image-input" type="file" accept="image/*" hidden onchange="sendMerchantChatImage(this)">
                        <input id="merchant-chat-input" type="text" placeholder="回复顾客：例如鼻托可调、建议换 51mm 镜圈、镜腿可改 145mm">
                        <button class="btn btn-primary" type="submit">回复</button>
                    </form>
                </section>
            </section>
        </main>
    </div>

    <div class="chat-image-viewer" id="merchant-chat-image-viewer" aria-hidden="true" onclick="closeMerchantChatImage()">
        <div class="chat-image-viewer-dialog" onclick="event.stopPropagation()">
            <button type="button" aria-label="关闭图片预览" onclick="closeMerchantChatImage()">×</button>
            <img id="merchant-chat-image-viewer-img" alt="商家聊天图片预览">
        </div>
    </div>

    <script src="merchant-chat.js?v=20260621-actionfix1"></script>
</body>
</html>
